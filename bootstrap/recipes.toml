[glibc]
name = "glibc"
version = "2.40"
source = "glibc"
depends = ["gcc", "binutils", "linux-headers"]
build = [
  { command = "../configure", args = ["--prefix=/usr", "--disable-werror", "--enable-kernel=5.4", "--enable-stack-protector=strong", "--with-headers=/usr/include", "--enable-bind-now", "--disable-profile", "--enable-add-ons", "--enable-lock-elision"], description = "Configure glibc", workdir = "build" },
  { command = "make", args = [], description = "Build glibc", workdir = "build" },
]
install = [
  { command = "make", args = ["install", "install_root=${DESTDIR}"], description = "Install glibc", workdir = "build" },
  { command = "mkdir", args = ["-p", "${DESTDIR}/etc"], description = "Create etc directory" },
  { command = "cp", args = ["../nscd/nscd.conf", "${DESTDIR}/etc/nscd.conf"], description = "Install nscd config" },
  { command = "mkdir", args = ["-p", "${DESTDIR}/var/cache/nscd"], description = "Create nscd cache directory" },
]
workdir = "."

[linux-headers]
name = "linux-headers"
version = "6.10.0"
source = "linux-headers"
depends = []
build = [
  { command = "make", args = ["mrproper"], description = "Clean kernel source" },
  { command = "make", args = ["headers"], description = "Build kernel headers" },
]
install = [
  { command = "make", args = ["headers_install", "INSTALL_HDR_PATH=${DESTDIR}/usr"], description = "Install kernel headers" },
  { command = "find", args = ["${DESTDIR}/usr/include", "-type", "f", "-name", "*.h", "-exec", "chmod", "644", "{}", ";"], description = "Fix header permissions" },
]
workdir = "."


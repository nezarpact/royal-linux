# Royal Linux Build Recipes
#
# This file defines the build recipes for packages. Each recipe specifies:
#   name        - Package name (must match the key)
#   version     - Package version
#   source      - Source key from sources.toml (must exist)
#   depends     - Optional list of package names this recipe depends on
#   build       - Build steps (array of objects with command and args)
#   install     - Installation steps (array of objects with command and args)
#   env         - Optional environment variables for build
#   workdir     - Optional working directory relative to extracted source
#
# IMPORTANT: These recipes are EXAMPLE/TEMPLATE definitions for the Royal Linux
# bootstrap toolchain. They reference source packages defined in sources.toml
# which currently contain PLACEHOLDER checksums (sha256 = "REPLACE_WITH_ACTUAL_SHA256_CHECKSUM").
#
# Before using these recipes for actual builds:
#   1. Obtain real SHA-256 checksums for all source tarballs in sources.toml
#   2. Verify all URLs are accessible and point to the correct versions
#   3. Test each recipe's build and install steps in a clean environment
#   4. Adjust build flags, dependencies, and steps as needed for your target
#
# These recipes represent a typical Linux-from-scratch style toolchain and base
# system. They are not guaranteed to build correctly without testing and
# adjustment for your specific architecture and requirements.
#
# Add recipes here when building the distribution.

[zlib]
name = "zlib"
version = "1.4"
source = "zlib"
depends = []
build = [
  { command = "./configure", args = ["--prefix=/usr"], description = "Configure zlib" },
  { command = "make", args = [], description = "Build zlib" },
  { command = "make", args = ["test"], description = "Test zlib" },
]
install = [
  { command = "make", args = ["install"], description = "Install zlib" },
]
workdir = "."

[openssl]
name = "openssl"
version = "3.5.0"
source = "openssl"
depends = ["zlib"]
build = [
  { command = "./Configure", args = ["linux-x86_64", "--prefix=/usr", "--openssldir=/etc/ssl", "--libdir=lib", "shared", "zlib-dynamic"], description = "Configure OpenSSL" },
  { command = "make", args = [], description = "Build OpenSSL" },
  { command = "make", args = ["test"], description = "Test OpenSSL" },
]
install = [
  { command = "make", args = ["install"], description = "Install OpenSSL" },
]
workdir = "."
env = { "KERNEL_BITS" = "64" }

[binutils]
name = "binutils"
version = "2.43.1"
source = "binutils"
depends = ["zlib"]
build = [
  { command = "../configure", args = ["--prefix=/usr", "--with-sysroot", "--enable-gold=default", "--enable-ld=default", "--enable-plugins", "--enable-shared", "--disable-werror", "--enable-64-bit-bfd", "--with-system-zlib"], description = "Configure binutils", workdir = "build" },
  { command = "make", args = ["tooldir=/usr"], description = "Build binutils", workdir = "build" },
]
install = [
  { command = "make", args = ["install", "tooldir=/usr"], description = "Install binutils", workdir = "build" },
]
workdir = "."

[gcc]
name = "gcc"
version = "14.2.0"
source = "gcc"
depends = ["binutils", "zlib", "gmp", "mpfr", "mpc"]
build = [
  { command = "../configure", args = ["--prefix=/usr", "--disable-multilib", "--enable-languages=c,c++", "--with-system-zlib", "--enable-shared", "--enable-threads=posix", "--enable-__cxa_atexit", "--disable-libunwind-exceptions", "--enable-clocale=gnu", "--disable-libstdcxx-pch", "--with-default-libstdcxx-abi=new", "--enable-gnu-unique-object", "--enable-linker-build-id", "--enable-lto", "--enable-plugin", "--enable-install-libiberty", "--with-linker-hash-style=gnu", "--enable-gnu-indirect-function", "--disable-werror", "--enable-checking=release"], description = "Configure GCC", workdir = "build" },
  { command = "make", args = [], description = "Build GCC", workdir = "build" },
  { command = "make", args = ["-k", "check"], description = "Test GCC", workdir = "build" },
]
install = [
  { command = "make", args = ["install"], description = "Install GCC", workdir = "build" },
  { command = "ln", args = ["-sv", "gcc", "${DESTDIR}/usr/bin/cc"], description = "Create cc symlink" },
]
workdir = "."

[gmp]
name = "gmp"
version = "6.3.0"
source = "gmp"
depends = []
build = [
  { command = "./configure", args = ["--prefix=/usr", "--enable-cxx", "--enable-fat"], description = "Configure GMP" },
  { command = "make", args = [], description = "Build GMP" },
  { command = "make", args = ["check"], description = "Test GMP" },
]
install = [
  { command = "make", args = ["install"], description = "Install GMP" },
]
workdir = "."


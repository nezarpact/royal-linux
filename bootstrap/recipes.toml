version = "8.2"
source = "readline"
depends = ["glibc", "ncurses"]
build = [
  { command = "./configure", args = ["--prefix=/usr", "--disable-static", "--with-curses"], description = "Configure readline" },
  { command = "make", args = ["SHLIB_LIBS=-lncursesw"], description = "Build readline" },
]
install = [
  { command = "make", args = ["install"], description = "Install readline" },
]
workdir = "."

[ncurses]
name = "ncurses"
version = "6.5"
source = "ncurses"
depends = ["glibc"]
build = [
  { command = "./configure", args = ["--prefix=/usr", "--with-shared", "--without-debug", "--without-normal", "--enable-pc-files", "--enable-widec", "--with-pkg-config-libdir=/usr/lib/pkgconfig"], description = "Configure ncurses" },
  { command = "make", args = [], description = "Build ncurses" },
]
install = [
  { command = "make", args = ["install"], description = "Install ncurses" },
  { command = "ln", args = ["-svf", "libncursesw.so", "${DESTDIR}/usr/lib/libncurses.so"], description = "Create libncurses symlink" },
  { command = "ln", args = ["-svf", "libformw.so", "${DESTDIR}/usr/lib/libform.so"], description = "Create libform symlink" },
  { command = "ln", args = ["-svf", "libpanelw.so", "${DESTDIR}/usr/lib/libpanel.so"], description = "Create libpanel symlink" },
  { command = "ln", args = ["-svf", "libmenuw.so", "${DESTDIR}/usr/lib/libmenu.so"], description = "Create libmenu symlink" },
  { command = "ln", args = ["-svf", "libncursesw.so", "${DESTDIR}/usr/lib/libcurses.so"], description = "Create libcurses symlink" },
]
workdir = "."


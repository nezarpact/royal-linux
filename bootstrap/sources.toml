# Royal Linux Source Definitions
#
# This file defines the source packages needed to build the Royal Linux system.
# Each entry contains:
#   name        - Package identifier (must match the key)
#   version     - Package version
#   url         - Download URL (HTTP or HTTPS)
#   sha256      - Expected SHA-256 checksum (64 hex characters)
#   archive     - Filename to save as (no path separators allowed)
#
# IMPORTANT: The checksums below are PLACEHOLDERS and MUST be replaced with
# actual SHA-256 checksums from the upstream source tarballs before use.
# Do not use these placeholder values in production builds.
#
# To obtain real checksums:
#   1. Download the source archive from the URL
#   2. Run: sha256sum <archive>
#   3. Replace the placeholder sha256 value with the actual checksum
#
# Add source definitions here when building the distribution.

[zlib]
name = "zlib"
version = "1.4"
url = "https://zlib.net/zlib-1.4.tar.gz"
sha256 = "02dd159783677a749c04adbdd02b55b8a2bcc7e054f51b76b549199a916ad584"
archive = "zlib-1.4.tar.gz"


[package]
name = "bootstrap"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
thiserror = "1.0"
reqwest = { version = "0.12", features = ["blocking", "rustls-tls"] }
sha2 = "0.10"
hex = "0.4"
url = "2.5"

[dev-dependencies]
tempfile = "3.0"
httpmock = "0.6"
